
name: Automatic CodeQL Autofix

on:
  schedule:
    - cron: "7,22,28,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: automatic-codeql-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Find alerts and create draft PRs
        env:
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          OWNER: costero-e
          REPO: beacon2-pi-api
          GH_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com"
          BASE="/repos/$OWNER/$REPO"

          api() {
            local method="$1"
            local path="$2"
            local data="${3:-}"

            if [[ -n "$data" ]]; then
              curl --silent --show-error --fail-with-body \
                -X "$method" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $AUTOFIX_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "$API$path" -d "$data"
            else
              curl --silent --show-error --fail-with-body \
                -X "$method" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $AUTOFIX_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "$API$path"
            fi
          }

          echo "Finding open CodeQL alerts on main..."

          alerts_json='[]'
          page=1

          while true; do
            page_data="$(api GET \
              "$BASE/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100&page=$page")"

            count="$(jq 'length' <<< "$page_data")"

            alerts_json="$(jq -s '.[0] + .[1]' \
              <(printf '%s' "$alerts_json") \
              <(printf '%s' "$page_data"))"

            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done

          mapfile -t ALERTS < <(
            jq -r '
              .[]
              | select(.tool.name == "CodeQL")
              | select(.most_recent_instance.ref == "refs/heads/main")
              | .number
            ' <<< "$alerts_json"
          )

          echo "Found ${#ALERTS[@]} open CodeQL alerts."

          if [[ ${#ALERTS[@]} -eq 0 ]]; then
            echo "No open CodeQL alerts to process."
            exit 0
          fi

          for ALERT_NUMBER in "${ALERTS[@]}"; do
            echo ""
            echo "======================================"
            echo "Processing alert #$ALERT_NUMBER"
            echo "======================================"

            BRANCH="codeql-autofix-alert-${ALERT_NUMBER}-${GH_RUN_ID}"

            echo "Checking for an existing open PR..."

            existing="$(api GET \
              "$BASE/pulls?state=open&head=$OWNER:codeql-autofix-alert-$ALERT_NUMBER&base=main")"

            if [[ "$(jq 'length' <<< "$existing")" -gt 0 ]]; then
              echo "Alert #$ALERT_NUMBER already has an open PR. Skipping."
              continue
            fi

            echo "Requesting classic Autofix..."

            api POST \
              "$BASE/code-scanning/alerts/$ALERT_NUMBER/autofix" \
              >/dev/null

            echo "Waiting for Autofix..."

            success=false

            for attempt in $(seq 1 60); do
              result="$(api GET \
                "$BASE/code-scanning/alerts/$ALERT_NUMBER/autofix")"

              status="$(jq -r '.status // "unknown"' <<< "$result")"

              echo "Attempt $attempt: $status"

              if [[ "$status" == "success" ]]; then
                success=true
                break
              fi

              if [[ "$status" == "failure" || "$status" == "failed" || "$status" == "error" ]]; then
                echo "Autofix failed for alert #$ALERT_NUMBER."
                break
              fi

              sleep 10
            done

            if [[ "$success" != "true" ]]; then
              echo "Skipping alert #$ALERT_NUMBER."
              continue
            fi

            description="$(jq -r '.description // "Suggested security fix."' <<< "$result")"

            echo "Creating branch $BRANCH..."

            main_ref="$(api GET "$BASE/git/ref/heads/main")"
            main_sha="$(jq -r '.object.sha' <<< "$main_ref")"

            ref_payload="$(jq -n \
              --arg ref "refs/heads/$BRANCH" \
              --arg sha "$main_sha" \
              '{ref: $ref, sha: $sha}')"

            api POST "$BASE/git/refs" "$ref_payload" >/dev/null

            echo "Committing Autofix..."

            commit_payload="$(jq -n \
              --arg target_ref "refs/heads/$BRANCH" \
              --arg message "Apply classic Copilot Autofix for CodeQL alert #$ALERT_NUMBER" \
              '{target_ref: $target_ref, message: $message}')"

            api POST \
              "$BASE/code-scanning/alerts/$ALERT_NUMBER/autofix/commits" \
              "$commit_payload" >/dev/null

            echo "Creating draft PR..."

            pr_payload="$(jq -n \
              --arg title "Security: fix CodeQL alert #$ALERT_NUMBER" \
              --arg head "$BRANCH" \
              --arg base "main" \
              --arg body "Automated draft PR containing a suggested fix generated by GitHub classic Copilot Autofix.

          CodeQL alert: #$ALERT_NUMBER

          Autofix description: $description

          Please review the changes and run tests before merging." \
              '{title:$title, head:$head, base:$base, body:$body, draft:true}')"

            pr="$(api POST "$BASE/pulls" "$pr_payload")"
            PR_URL="$(jq -r '.html_url' <<< "$pr")"

            echo "Created: $PR_URL"

            {
              echo "### CodeQL alert #$ALERT_NUMBER"
              echo "Draft PR: $PR_URL"
            } >> "$GITHUB_STEP_SUMMARY"

          done

          echo "Finished processing CodeQL alerts."
