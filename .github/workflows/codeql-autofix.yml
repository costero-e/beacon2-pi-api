
name: CodeQL Classic Autofix

on:
  workflow_dispatch:
    inputs:
      alert_number:
        description: "CodeQL alert number to fix"
        required: true
        type: string

permissions: {}

concurrency:
  group: codeql-autofix-${{ inputs.alert_number }}
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate and publish classic Autofix
        env:
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          OWNER: costero-e
          REPO: beacon2-pi-api
          ALERT_NUMBER: ${{ inputs.alert_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$ALERT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid alert number."
            exit 1
          fi

          API="https://api.github.com"
          BASE="/repos/$OWNER/$REPO"

          api() {
            local method="$1"
            local path="$2"
            local data="${3:-}"

            if [[ -n "$data" ]]; then
              curl --silent --show-error --fail-with-body \
                -X "$method" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $AUTOFIX_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "$API$path" \
                -d "$data"
            else
              curl --silent --show-error --fail-with-body \
                -X "$method" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $AUTOFIX_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "$API$path"
            fi
          }

          echo "Checking CodeQL alert #$ALERT_NUMBER..."

          alert="$(api GET "$BASE/code-scanning/alerts/$ALERT_NUMBER")"

          if ! jq -e '
            .tool.name == "CodeQL" and
            .state == "open" and
            .most_recent_instance.ref == "refs/heads/main"
          ' <<< "$alert" >/dev/null; then
            echo "Alert must be an open CodeQL alert on main."
            exit 1
          fi

          echo "Requesting classic Autofix..."

          api POST \
            "$BASE/code-scanning/alerts/$ALERT_NUMBER/autofix" \
            >/dev/null

          echo "Waiting for the fix..."

          success=false

          for attempt in $(seq 1 60); do
            result="$(api GET \
              "$BASE/code-scanning/alerts/$ALERT_NUMBER/autofix")"

            status="$(jq -r '.status // "unknown"' <<< "$result")"

            echo "Attempt $attempt: $status"

            if [[ "$status" == "success" ]]; then
              success=true
              break
            fi

            if [[ "$status" == "failure" || "$status" == "failed" || "$status" == "error" ]]; then
              jq -r '.description // "Autofix failed."' <<< "$result"
              exit 1
            fi

            sleep 10
          done

          if [[ "$success" != "true" ]]; then
            echo "Autofix did not complete within 10 minutes."
            exit 1
          fi

          description="$(jq -r '.description // "Suggested security fix."' <<< "$result")"

          BRANCH="codeql-autofix-alert-$ALERT_NUMBER"

          echo "Checking for an existing open PR..."

          existing="$(api GET \
            "$BASE/pulls?state=open&head=$OWNER:$BRANCH&base=main")"

          if [[ "$(jq 'length' <<< "$existing")" -gt 0 ]]; then
            echo "An open PR already exists:"
            jq -r '.[0].html_url' <<< "$existing"
            exit 0
          fi

          echo "Creating branch from main..."

          main_ref="$(api GET "$BASE/git/ref/heads/main")"
          main_sha="$(jq -r '.object.sha' <<< "$main_ref")"

          ref_payload="$(jq -n \
            --arg ref "refs/heads/$BRANCH" \
            --arg sha "$main_sha" \
            '{ref: $ref, sha: $sha}')"

          api POST "$BASE/git/refs" "$ref_payload" >/dev/null

          echo "Committing Autofix to $BRANCH..."

          commit_payload="$(jq -n \
            --arg target_ref "refs/heads/$BRANCH" \
            --arg message "Apply classic Copilot Autofix for CodeQL alert #$ALERT_NUMBER" \
            '{target_ref: $target_ref, message: $message}')"

          api POST \
            "$BASE/code-scanning/alerts/$ALERT_NUMBER/autofix/commits" \
            "$commit_payload" >/dev/null

          echo "Opening draft pull request..."

          pr_payload="$(jq -n \
            --arg title "Security: fix CodeQL alert #$ALERT_NUMBER" \
            --arg head "$BRANCH" \
            --arg base "main" \
            --arg body "## Automated CodeQL remediation

          This draft PR contains a suggested fix generated by GitHub classic Copilot Autofix.

          **CodeQL alert:** #$ALERT_NUMBER

          **Autofix description:** $description

          Please review the changes and run all tests before merging.

          This PR was created using the classic Autofix API." \
            '{title: $title, head: $head, base: $base, body: $body, draft: true}')"

          pr="$(api POST "$BASE/pulls" "$pr_payload")"

          PR_URL="$(jq -r '.html_url' <<< "$pr")"

          echo "Draft PR created: $PR_URL"

          {
            echo "## CodeQL Autofix"
            echo "Created draft PR: $PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"
